<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>收件匣</title>
    <style>
      :root {
        --bg-0: #101215;
        --bg-1: #16191d;
        --bg-2: #1d2126;
        --bg-3: #252a31;
        --line: #2a3037;
        --line-2: #3a424c;
        --fg: #eceef1;
        --fg-2: #bcc3cb;
        --fg-3: #959ea8;
        --amber: #f2b33d;
        --teal: #3fd3be;
        --red: #ff6f62;
        --ink: #121417;
        --sans:
          "PingFang TC", "SF Pro Text", -apple-system, ui-sans-serif,
          "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --r: 10px;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg-0);
        color: var(--fg);
        font: 15px/1.7 var(--sans);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        background: var(--bg-1);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      .count {
        color: var(--fg-2);
        font-size: 14px;
      }
      .count b {
        color: var(--amber);
      }
      .updated {
        margin-left: auto;
        color: var(--fg-3);
        font-size: 13px;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 20px 16px 120px;
      }
      h2 {
        font-size: 14px;
        color: var(--fg-3);
        font-weight: 600;
        margin: 28px 0 10px;
      }
      .empty {
        color: var(--fg-3);
        padding: 28px;
        text-align: center;
        border: 1px dashed var(--line-2);
        border-radius: var(--r);
      }
      .card {
        background: var(--bg-1);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px 18px;
        margin-bottom: 14px;
      }
      .card.done {
        opacity: 0.8;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        color: var(--fg-3);
      }
      .tag {
        padding: 1px 8px;
        border-radius: 99px;
        background: var(--bg-3);
        color: var(--fg-2);
      }
      .tag.info {
        color: var(--teal);
      }
      .tag.due {
        color: var(--amber);
      }
      .card h3 {
        margin: 6px 0 8px;
        font-size: 17px;
        line-height: 1.5;
      }
      .body {
        color: var(--fg-2);
        max-width: 72ch;
      }
      .body p {
        margin: 0 0 8px;
      }
      .body code {
        font-family: var(--mono);
        font-size: 13px;
        background: var(--bg-3);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .body a {
        color: var(--teal);
      }
      .opts {
        display: grid;
        gap: 8px;
        margin: 12px 0;
      }
      .opt {
        position: relative;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 12px;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        cursor: pointer;
        background: var(--bg-2);
      }
      .opt input {
        position: absolute;
        opacity: 0;
      }
      .opt .key {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--bg-3);
        font-weight: 700;
      }
      .opt:has(input:checked) {
        border-color: var(--amber);
      }
      .opt:has(input:checked) .key {
        background: var(--amber);
        color: var(--ink);
      }
      .opt:has(input:focus-visible) {
        outline: 3px solid var(--teal);
        outline-offset: 2px;
      }
      .rec {
        color: var(--amber);
        font-size: 13px;
        margin-left: 4px;
      }
      textarea {
        width: 100%;
        min-height: 44px;
        resize: vertical;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--line-2);
        background: var(--bg-2);
        color: var(--fg);
        font: inherit;
      }
      textarea:focus {
        outline: 2px solid var(--teal);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid var(--line-2);
        background: var(--bg-3);
        color: var(--fg);
        padding: 7px 14px;
        cursor: pointer;
      }
      button.primary {
        background: var(--amber);
        color: var(--ink);
        border-color: var(--amber);
        font-weight: 700;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .hint {
        color: var(--fg-3);
        font-size: 13px;
      }
      .err {
        color: var(--red);
        font-size: 13px;
      }
      .answer {
        margin-top: 10px;
        padding: 10px 12px;
        border-left: 3px solid var(--teal);
        background: var(--bg-2);
        border-radius: 0 8px 8px 0;
        font-size: 14px;
      }
      .answer .who {
        color: var(--fg-3);
        font-size: 12px;
      }
      footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        background: var(--bg-1);
        border-top: 1px solid var(--line);
      }
      details.history summary {
        cursor: pointer;
        color: var(--fg-3);
        font-size: 14px;
        margin: 28px 0 10px;
      }
      .tabs {
        display: flex;
        gap: 4px;
      }
      .tabs button {
        padding: 4px 12px;
        background: transparent;
        border-color: transparent;
        color: var(--fg-3);
      }
      .tabs button[aria-selected="true"] {
        background: var(--bg-3);
        border-color: var(--line-2);
        color: var(--fg);
      }
      .tabs .n {
        color: var(--amber);
        margin-left: 4px;
      }
      #board {
        max-width: 1280px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 16px;
        align-items: start;
      }
      .col h2 {
        margin-top: 0;
      }
      .col .n {
        color: var(--fg-2);
        margin-left: 4px;
      }
      .col details summary {
        cursor: pointer;
        color: var(--fg-3);
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .line {
        background: var(--bg-1);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px 14px;
        margin-bottom: 10px;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .line.stale {
        opacity: 0.6;
        border-style: dashed;
      }
      .line h3 {
        margin: 4px 0 6px;
        font-size: 15px;
        line-height: 1.5;
      }
      .line .branch {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg-3);
      }
      .line .field {
        color: var(--fg-2);
        margin-top: 4px;
      }
      .line .field b {
        color: var(--fg-3);
        font-weight: 400;
        margin-right: 4px;
      }
      .line .blocker {
        color: var(--red);
      }
      .tag.stale {
        color: var(--red);
      }
      button.badge {
        padding: 1px 8px;
        border-radius: 99px;
        font-size: 13px;
        background: var(--amber);
        color: var(--ink);
        border-color: var(--amber);
        font-weight: 700;
      }
      .filter {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        margin-top: 16px;
        padding: 3px 4px 3px 12px;
        border-radius: 99px;
        background: var(--bg-3);
        font-size: 13px;
        color: var(--fg-2);
      }
      .filter button {
        padding: 0 8px;
        font-size: 13px;
      }
      @media (max-width: 640px) {
        header {
          flex-wrap: wrap;
        }
        .updated {
          margin-left: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>收件匣</h1>
      <nav class="tabs" role="tablist" aria-label="分頁">
        <button role="tab" id="tab-inbox" data-tab="inbox" aria-controls="main">收件匣</button>
        <button role="tab" id="tab-board" data-tab="board" aria-controls="board">
          看板<span class="n" id="board-count"></span>
        </button>
      </nav>
      <span class="count" id="count"></span>
      <span class="updated" id="updated">載入中…</span>
    </header>
    <main id="main" role="tabpanel" aria-labelledby="tab-inbox"></main>
    <section id="board" role="tabpanel" aria-labelledby="tab-board" hidden></section>
    <footer>
      <span class="hint" id="ready"></span>
      <button class="primary" id="send-all" disabled>送出全部已答</button>
      <span class="err" id="err" role="alert"></span>
    </footer>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get("t")) {
        sessionStorage.setItem("inbox-token", params.get("t"));
        history.replaceState(null, "", location.pathname);
      }
      const TOKEN = sessionStorage.getItem("inbox-token") || "";
      const HEADERS = {
        "Content-Type": "application/json",
        "X-Inbox-Token": TOKEN,
      };
      let STATE = { questions: [], board: [], board_error: "" };
      let TAB = "inbox";
      let FILTER = null; // { id: 工作線代號, ids: [題號...] }
      try {
        if (localStorage.getItem("inbox-tab") === "board") TAB = "board";
      } catch (e) {}
      let lastJson = "";
      let dirtyWhileEditing = false;

      const $ = (id) => document.getElementById(id);
      const draftKey = (id) => "inbox-draft-" + id;
      const getDraft = (id) =>
        JSON.parse(localStorage.getItem(draftKey(id)) || "{}");
      const setDraft = (id, d) =>
        localStorage.setItem(draftKey(id), JSON.stringify(d));

      // <pure>  純函式區段：測試會把這段丟給 node 執行
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function renderBody(text) {
        return String(text || "")
          .trim()
          .split(/\n{2,}/)
          .filter(Boolean)
          .map((para) => {
            let h = esc(para);
            h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
            h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
            h = h.replace(
              /https?:\/\/[^\s<]+/g,
              (u) =>
                '<a href="' +
                u +
                '" target="_blank" rel="noopener noreferrer">' +
                u +
                "</a>",
            );
            return "<p>" + h.replace(/\n/g, "<br>") + "</p>";
          })
          .join("");
      }

      function when(iso) {
        const d = new Date(iso);
        return isNaN(d)
          ? ""
          : d.getMonth() +
              1 +
              "/" +
              d.getDate() +
              " " +
              String(d.getHours()).padStart(2, "0") +
              ":" +
              String(d.getMinutes()).padStart(2, "0");
      }

      function isOpen(q) {
        return !q.closed && q.answers.length === 0;
      }

      const STATUSES = [
        ["active", "進行中"],
        ["blocked", "卡住"],
        ["review", "待驗收"],
        ["idle", "閒置"],
        ["done", "完成"],
      ];

      function ago(iso) {
        const t = new Date(iso).getTime();
        if (isNaN(t)) return "沒有紀錄";
        const m = Math.max(0, Math.round((Date.now() - t) / 60000));
        if (m < 1) return "剛剛";
        if (m < 60) return m + " 分鐘前";
        if (m < 60 * 48) return Math.round(m / 60) + " 小時前";
        return Math.round(m / 1440) + " 天前";
      }

      function boardCardHtml(l) {
        const field = (label, value, cls) =>
          value
            ? '<div class="field' +
              (cls ? " " + cls : "") +
              '"><b>' +
              label +
              "</b>" +
              esc(value) +
              "</div>"
            : "";
        const tags = ['<span class="tag">' + esc(l.id) + "</span>"];
        if (l.session) tags.push("<span>" + esc(l.session) + "</span>");
        if (l.stale)
          tags.push(
            '<span class="tag stale">' + ago(l.last_active) + "沒動靜</span>",
          );
        if (l.open_questions > 0)
          tags.push(
            '<button class="badge" data-filter="' +
              esc(l.id) +
              '" title="看這個專案的未答題">' +
              Number(l.open_questions) +
              " 題待回</button>",
          );
        return (
          '<article class="line' +
          (l.stale ? " stale" : "") +
          '">' +
          '<div class="meta">' +
          tags.join("") +
          "</div>" +
          "<h3>" +
          esc(l.task || l.project || l.id) +
          "</h3>" +
          (l.branch ? '<div class="branch">' + esc(l.branch) + "</div>" : "") +
          field("進度", l.progress) +
          field("卡點", l.blocker, "blocker") +
          field("下一步", l.next) +
          '<div class="field"><b>最後活動</b>' +
          ago(l.last_active) +
          "</div>" +
          "</article>"
        );
      }

      // 最新消息在上：依 updated_at（沒有就用 last_active）由新到舊
      function lineTime(l) {
        const t = new Date(l.updated_at || l.last_active || 0).getTime();
        return isNaN(t) ? 0 : t;
      }

      function boardHtml(lines) {
        const known = STATUSES.map(([k]) => k);
        lines = lines.slice().sort((a, b) => lineTime(b) - lineTime(a));
        return (
          '<div class="cols">' +
          STATUSES.map(([key, label]) => {
            const mine = lines.filter((l) =>
              key === "active"
                ? l.status === "active" || !known.includes(l.status)
                : l.status === key,
            );
            const head = label + '<span class="n">' + mine.length + "</span>";
            const cards = mine.length
              ? mine.map(boardCardHtml).join("")
              : '<div class="hint">（無）</div>';
            return (
              '<div class="col">' +
              (key === "done"
                ? "<details><summary>" + head + "</summary>" + cards + "</details>"
                : "<h2>" + head + "</h2>" + cards) +
              "</div>"
            );
          }).join("") +
          "</div>"
        );
      }
      // </pure>

      function ready(q) {
        const d = getDraft(q.id);
        return q.kind === "info"
          ? true
          : Boolean(d.choice || (d.text || "").trim());
      }

      function cardHtml(q) {
        const d = getDraft(q.id);
        const open = isOpen(q);
        const tags = [
          '<span class="tag">' + esc(q.from) + "</span>",
          "<span>" + when(q.created) + "</span>",
        ];
        if (q.kind === "info") tags.push('<span class="tag info">知會</span>');
        if (q.deadline)
          tags.push(
            '<span class="tag due">期限：' + esc(q.deadline) + "</span>",
          );
        let html =
          '<article class="card' +
          (open ? "" : " done") +
          '" data-id="' +
          esc(q.id) +
          '">' +
          '<div class="meta">' +
          tags.join("") +
          "</div><h3>" +
          esc(q.title) +
          "</h3>" +
          '<div class="body">' +
          renderBody(q.body) +
          "</div>";
        if (open) {
          if (q.options.length) {
            html +=
              '<div class="opts" role="radiogroup" aria-label="' +
              esc(q.title) +
              '">' +
              q.options
                .map(
                  (o) =>
                    '<label class="opt"><input type="radio" name="c-' +
                    esc(q.id) +
                    '" value="' +
                    esc(o.key) +
                    '"' +
                    (d.choice === o.key ? " checked" : "") +
                    '><span class="key">' +
                    esc(o.key) +
                    "</span><span>" +
                    esc(o.label) +
                    (o.recommended ? '<span class="rec">（推薦）</span>' : "") +
                    "</span></label>",
                )
                .join("") +
              "</div>";
          }
          html +=
            '<textarea data-text placeholder="' +
            (q.kind === "info"
              ? "有意見可以寫在這裡（選填）"
              : "補充說明（選填；沒有選項的題目直接寫答案）") +
            '">' +
            esc(d.text || "") +
            "</textarea>" +
            '<div class="row"><button data-send>' +
            (q.kind === "info" ? "我知道了" : "這題先送") +
            "</button></div>";
        }
        q.answers.forEach((a) => {
          const pick =
            a.choice === "ack"
              ? "我知道了"
              : a.choice
                ? a.choice + " " + a.choice_label
                : "";
          html +=
            '<div class="answer"><div class="who">你在 ' +
            when(a.at) +
            " 回覆 · " +
            (a.delivered ? "agent 已收到" : "等 agent 來拿") +
            "</div>" +
            (pick ? "<div>" + esc(pick) + "</div>" : "") +
            (a.text ? "<div>" + esc(a.text) + "</div>" : "") +
            "</div>";
        });
        return html + "</article>";
      }

      function render() {
        renderBoard();
        const shown = FILTER
          ? STATE.questions.filter((q) => FILTER.ids.includes(q.id))
          : STATE.questions;
        const open = shown.filter(isOpen).reverse();
        const answered = shown
          .filter((q) => !q.closed && q.answers.length)
          .reverse();
        const closed = shown.filter((q) => q.closed).reverse();
        $("count").innerHTML =
          "待你回 <b>" + STATE.questions.filter(isOpen).length + "</b> 題";
        let html =
          (FILTER
            ? '<div class="filter">工作線：' +
              esc(FILTER.id) +
              '<button data-clear-filter aria-label="移除篩選">×</button></div>'
            : "") +
          "<h2>待你回答</h2>" +
          (open.length
            ? open.map(cardHtml).join("")
            : '<div class="empty">目前沒有要你回答的事。</div>');
        if (answered.length)
          html +=
            "<h2>已回答、等 agent 處理</h2>" + answered.map(cardHtml).join("");
        if (closed.length)
          html +=
            '<details class="history"><summary>已收起 ' +
            closed.length +
            " 題</summary>" +
            closed.map(cardHtml).join("") +
            "</details>";
        $("main").innerHTML = html;
        updateFooter();
      }

      function renderBoard() {
        const lines = STATE.board || [];
        const active = lines.filter((l) => l.status !== "done").length;
        $("board-count").textContent = active ? String(active) : "";
        $("board").innerHTML =
          (STATE.board_error
            ? '<div class="err">' + esc(STATE.board_error) + "</div>"
            : "") +
          (lines.length
            ? boardHtml(lines)
            : '<div class="empty">看板上還沒有工作線。用 <code>inbox status set &lt;代號&gt;</code> 回報。</div>');
      }

      function showTab(tab) {
        TAB = tab;
        try {
          localStorage.setItem("inbox-tab", tab);
        } catch (e) {}
        $("main").hidden = tab !== "inbox";
        document.querySelector("footer").hidden = tab !== "inbox";
        $("board").hidden = tab !== "board";
        $("count").hidden = tab !== "inbox";
        for (const b of document.querySelectorAll("[data-tab]"))
          b.setAttribute("aria-selected", String(b.dataset.tab === tab));
      }

      function updateFooter() {
        const n = STATE.questions.filter(
          (q) => isOpen(q) && q.kind !== "info" && ready(q),
        ).length;
        $("ready").textContent = n ? "已答 " + n + " 題" : "";
        $("send-all").disabled = n === 0;
      }

      async function load() {
        try {
          const res = await fetch("/api/state", {
            headers: HEADERS,
            cache: "no-store",
          });
          if (!res.ok)
            throw new Error(
              res.status === 401
                ? "網址少了 token，請用 inbox url 印出的完整網址"
                : "讀取失敗（" + res.status + "）",
            );
          const text = await res.text();
          $("updated").textContent =
            "更新於 " +
            new Date().toLocaleTimeString("zh-TW", { hour12: false });
          $("err").textContent = "";
          if (text === lastJson) return;
          lastJson = text;
          STATE = JSON.parse(text);
          if (
            document.activeElement &&
            document.activeElement.matches("textarea")
          ) {
            dirtyWhileEditing = true;
            return;
          }
          render();
        } catch (e) {
          $("updated").textContent = "連不上服務";
          $("err").textContent = e.message;
        }
      }

      async function send(ids) {
        const answers = ids.map((id) => {
          const d = getDraft(id);
          const q = STATE.questions.find((x) => x.id === id);
          return {
            question_id: id,
            choice: q.kind === "info" ? "ack" : d.choice || "",
            text: d.text || "",
          };
        });
        $("err").textContent = "";
        const res = await fetch("/api/answer", {
          method: "POST",
          headers: HEADERS,
          body: JSON.stringify({ answers }),
        });
        if (!res.ok) {
          $("err").textContent = "送出失敗：" + (await res.text());
          return;
        }
        ids.forEach((id) => localStorage.removeItem(draftKey(id)));
        lastJson = "";
        await load();
      }

      document.addEventListener("change", (e) => {
        const card = e.target.closest(".card");
        if (!card || e.target.type !== "radio") return;
        const d = getDraft(card.dataset.id);
        d.choice = e.target.value;
        setDraft(card.dataset.id, d);
        updateFooter();
      });
      document.addEventListener("input", (e) => {
        const card = e.target.closest(".card");
        if (!card || !e.target.matches("[data-text]")) return;
        const d = getDraft(card.dataset.id);
        d.text = e.target.value;
        setDraft(card.dataset.id, d);
        updateFooter();
      });
      document.addEventListener("focusout", () => {
        setTimeout(() => {
          if (
            dirtyWhileEditing &&
            !(
              document.activeElement &&
              document.activeElement.matches("textarea")
            )
          ) {
            dirtyWhileEditing = false;
            render();
          }
        }, 0);
      });
      document.addEventListener("click", (e) => {
        const tabBtn = e.target.closest("[data-tab]");
        if (tabBtn) return showTab(tabBtn.dataset.tab);
        const badge = e.target.closest("[data-filter]");
        if (badge) {
          const line = (STATE.board || []).find(
            (l) => l.id === badge.dataset.filter,
          );
          if (!line) return;
          FILTER = { id: line.id, ids: line.open_question_ids || [] };
          showTab("inbox");
          render();
          window.scrollTo(0, 0);
          return;
        }
        if (e.target.closest("[data-clear-filter]")) {
          FILTER = null;
          render();
          return;
        }
        const btn = e.target.closest("[data-send]");
        if (btn) {
          const id = btn.closest(".card").dataset.id;
          const q = STATE.questions.find((x) => x.id === id);
          if (q.kind !== "info" && !ready(q)) {
            $("err").textContent = "這題還沒選，也沒有寫補充。";
            return;
          }
          send([id]);
        }
      });
      $("send-all").addEventListener("click", () => {
        send(
          STATE.questions
            .filter((q) => isOpen(q) && q.kind !== "info" && ready(q))
            .map((q) => q.id),
        );
      });

      showTab(TAB);
      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>
